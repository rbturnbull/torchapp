[project]
name = "torchapp"
version = "0.5.10"
description = "A wrapper for PyTorch projects to create easy command-line interfaces and manage hyper-parameter tuning."
authors = [{ name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" }]
license = "Apache-2.0"
readme = "README.rst"
requires-python = ">=3.10,<3.15"
keywords = ["PyTorch", "pytorch", "deep learning", "command-line interface"]
# For classifiers see https://pypi.org/classifiers/
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.22.0",
    "executing>=2.0.1",
    "torch>=1.12.1",
    "lightning>=2.3.3,!=2.6.2,!=2.6.3",
    "typer>=0.4.0",
    "rich>=10.16.1",
    "pandas>=1.3.5",
    "wandb>=0.12.9",
    "cookiecutter>=2.1.1",
    "scikit-learn>=1.0.2",
    "Pillow>=9.0.1",
    "PyYAML>=6.0",
    "torchvision>=0.13.0",
    "pybtex>=0.24.0",
    "pyjwt>=2.4.0",
    "optuna>=2.10.0",
    "pybtexnbib>=0.1.1",
    "scikit-optimize>=0.9.0",
    "scipy>=1.9.1",
    "appdirs>=1.4.4",
    "cmaes>=0.11.1",
    "grokadamw>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/rbturnbull/torchapp"
Repository = "https://github.com/rbturnbull/torchapp"
Documentation = "https://rbturnbull.github.io/torchapp/"

[project.scripts]
torchapp-generator = "torchapp.generator:app"
torchapp-imageclassifier = "torchapp.examples.image_classifier:ImageClassifier.main"
torchapp-imageclassifier-tools = "torchapp.examples.image_classifier:ImageClassifier.tools"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "ipython>=8.1.1",
    "ipykernel>=6.6.1",
    "coverage>=5.5",
    "autopep8>=1.5.7",
    "Sphinx>=4.2.0",
    "nbsphinx>=0.8.7",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autobuild>=2021.3.14",
    "myst-parser>=0.15.2",
    "pre-commit>=2.15.0",
    "sphinx-copybutton>=0.4.0",
    "black>=21.10b0",
    "jupyter>=1.0.0",
    "pyment>=0.3.3",
    "plotly>=5.8.2",
    "sphinx-click @ git+https://github.com/rbturnbull/sphinx-click.git",
]

[tool.poetry]
requires-poetry = ">=2.0"

[tool.black]
line-length = 120
skip_string_normalization = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
